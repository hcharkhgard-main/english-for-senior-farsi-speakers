<!-- Content security policy. Only this site's own files may run or be loaded, and the app may talk only to this
     site (plus the optional live-partner service, filled in from config.json by the build). Each exception, and why:
       script-src 'wasm-unsafe-eval'  the on-device speech recogniser is WebAssembly; without it the pronunciation check
                                      cannot start (tested: tests/e2e/mic.mjs fails without it).
       script-src 'unsafe-eval'       for iPhones that cannot go beyond iOS 15 (6s, 7, first SE): Safari 15 does not know
                                      'wasm-unsafe-eval' and, as far as its documentation says, then refuses WebAssembly.
                                      NOT TESTED on an iOS 15 device. Chromium does not need it. The app never evaluates
                                      text as code. Remove it when iOS 15 no longer has to be supported.
       media-src blob:                every sound is cut out of a downloaded pack and played from memory.
       media-src data:                the moment of silence that lets an iPhone play sound after the first tap.
     Not needed and therefore absent: data: images, blob: workers, inline styles or scripts, any other site.
     (A policy in a meta tag cannot say who may put this page in a frame; GitHub Pages cannot send that header.) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self'; img-src 'self'; font-src 'self'; media-src 'self' blob: data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
